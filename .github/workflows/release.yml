name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -r requirements.txt
      - name: Verify release version
        run: >-
          python -c "from autoclicker import updater; tag='${{ github.ref_name }}';
          assert updater.CURRENT_VERSION == tag.lstrip('v'),
          f'{updater.CURRENT_VERSION} does not match {tag}'"
      - name: Build Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon img/icon.ico --name AutoKeyPresser main.py
          Compress-Archive -Path dist/AutoKeyPresser.exe -DestinationPath dist/AutoKeyPresser-Portable.zip -Force
          choco install innosetup --no-progress -y
          $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe" }
          & $iscc installer.iss
      - name: Build Linux artifacts
        if: runner.os == 'Linux'
        run: xvfb-run -a ./build_linux.sh
      - name: Build macOS artifacts
        if: runner.os == 'macOS'
        run: ./build_macos.sh
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.AppImage
            dist/*.tar.gz
